services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yubarta
      POSTGRES_DB: yubarta
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${YUBARTA_TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yubarta"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  sandbox:
    build:
      context: .
      dockerfile: tests/sandbox/Dockerfile
    ports:
      - "127.0.0.1:${YUBARTA_TEST_SSH_PORT:-55222}:22"
      - "127.0.0.1:${YUBARTA_TEST_HTTP_PORT:-55808}:8080"
    volumes:
      - type: bind
        source: ${YUBARTA_TEST_PUBLIC_KEY:?Set YUBARTA_TEST_PUBLIC_KEY to an ephemeral public key}
        target: /run/test-key.pub
        read_only: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',22),2).close()"]
      interval: 1s
      timeout: 3s
      retries: 30
