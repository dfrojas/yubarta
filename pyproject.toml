[project]
name = "yubarta"
version = "1.0.0"
description = "Autonomous remediation agent for self-hosted infrastructure"
requires-python = ">=3.12"
dependencies = [
    "asyncssh==2.21.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.46",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.9",
    "aiosqlite==0.22.1",
    "alembic==1.17.2",
    "typer==0.21.1",
    "greenlet==3.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.9",
]

[project.scripts]
yubarta = "yubarta.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yubarta*"]
