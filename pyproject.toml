[project]
name = "yubarta"
version = "1.0.0"
description = "Autonomous remediation agent for self-hosted infrastructure"
requires-python = ">=3.12"
dependencies = [
    "asyncssh==2.21.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.46",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.9",
    "aiosqlite==0.22.1",
    "alembic==1.17.2",
    "typer==0.21.1",
    "greenlet==3.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.9",
    "ruff==0.16.8",
]

[project.scripts]
yubarta = "yubarta.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["legacy", ".agents", "sandbox", "docs", "infra"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "UP042",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "auto"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yubarta*"]
