[tool.poetry]
name = "yubarta"
version = "0.1.0"
description = "An application to deploy eBPF programs to remote machines"
authors = ["Diego Fernando Rojas <hello@dfrojas.com>"]
packages = [
    { include = "engine", from = "src" }
]

[tool.poetry.scripts]
yubarta-api  = "engine.api_server.launcher:start_api"
yubarta-cli = "engine.cli.commands:app"

[tool.poetry.dependencies]
python = "^3.10"  # REMINDER: Make it a min 3.10
typer = "^0.9.0"
pyyaml = "^6.0.1"
requests = "^2.31.0"
fastapi = "^0.100.0"
uvicorn = "^0.23.1"
paramiko = "^3.2.0"
sqlalchemy = "^2.0.28"
pydantic = "^2.10.4"
sqlmodel = "^0.0.22"

[tool.poetry.dev-dependencies]
pytest = "^7.3.1"
ruff = "^0.6.4"
black = "^24.3.0"
ipdb = "^0.13.11"

[tool.pytest.ini_options]
pythonpath = ["./src"]
testpaths = ["./tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
